name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist_dir: ${{ steps.detect.outputs.dist_dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect frontend directory and base path
        id: detect
        run: |
          if [ -f "frontend/package.json" ]; then
            FRONTEND_DIR="frontend"
          elif [ -f "certifix-ai/frontend/package.json" ]; then
            FRONTEND_DIR="certifix-ai/frontend"
          else
            echo "Could not locate frontend/package.json"
            exit 1
          fi
          echo "frontend_dir=$FRONTEND_DIR" >> "$GITHUB_OUTPUT"
          echo "dist_dir=$FRONTEND_DIR/dist" >> "$GITHUB_OUTPUT"

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          if [[ "$REPO_LOWER" == *.github.io ]]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "**/frontend/package-lock.json"

      - name: Install dependencies and build frontend
        working-directory: ${{ steps.detect.outputs.frontend_dir }}
        env:
          VITE_BASE_PATH: ${{ steps.detect.outputs.base_path }}
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll

      - name: Publish build to gh-pages branch (for 'Deploy from a branch' mode)
        env:
          DIST_DIR: ${{ steps.detect.outputs.dist_dir }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKTREE_DIR=$(mktemp -d)
          cp -r "$DIST_DIR"/. "$WORKTREE_DIR"/
          cd "$WORKTREE_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy CertiFix AI to GitHub Pages"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.dist_dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (for 'GitHub Actions' mode)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
